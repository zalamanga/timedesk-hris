services:
  testdb:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hris_test
      POSTGRES_USER: hris_test
      POSTGRES_PASSWORD: isolated-test-only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U hris_test -d hris_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 256m
  tests:
    build:
      context: ./backend
      target: test
    environment:
      DATABASE_URL: postgresql+psycopg://hris_test:isolated-test-only@testdb:5432/hris_test
      APP_TEST_DATABASE_URL: postgresql+psycopg://hris_test:isolated-test-only@testdb:5432/hris_test
    depends_on:
      testdb:
        condition: service_healthy
    command: [python, -m, pytest, -q]
    mem_limit: 512m
