services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hris
      POSTGRES_USER: hris
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?Run scripts/Start.ps1 or configure .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U hris -d hris"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 256m
    restart: unless-stopped
  api:
    build:
      context: ./backend
      target: runtime
    environment:
      DATABASE_URL: postgresql+psycopg://hris:${APP_DB_PASSWORD}@db:5432/hris
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-http://localhost:8095,http://127.0.0.1:8095}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
      APP_DEMO_MODE: ${APP_DEMO_MODE:-true}
      APP_DEMO_PASSWORD: ${APP_DEMO_PASSWORD:?Configure a private demo password}
      APP_SEED_DEMO: ${APP_SEED_DEMO:-true}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    mem_limit: 384m
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    ports:
      - "127.0.0.1:${APP_HTTP_PORT:-8095}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/api/health]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 64m
    restart: unless-stopped
volumes:
  postgres_data:
