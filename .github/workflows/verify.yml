name: Verify TimeDesk HRIS
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hris_test
          POSTGRES_USER: hris_test
          POSTGRES_PASSWORD: isolated-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hris_test -d hris_test"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://hris_test:isolated-ci-only@127.0.0.1:5432/hris_test
      APP_TEST_DATABASE_URL: postgresql+psycopg://hris_test:isolated-ci-only@127.0.0.1:5432/hris_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m app.cli init-db
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  browser:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      APP_DEMO_PASSWORD: isolated-browser-ci-only-password
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Configure isolated demo
        run: |
          printf '%s\n' 'APP_HTTP_PORT=8095' 'APP_DB_PASSWORD=isolated-database-ci-only' "APP_DEMO_PASSWORD=$APP_DEMO_PASSWORD" 'APP_DEMO_MODE=true' 'APP_SEED_DEMO=true' 'APP_COOKIE_SECURE=false' > .env
      - run: docker compose --project-name timedesk-hris up --build -d --wait --wait-timeout 180
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Stop isolated CI containers
        if: always()
        run: docker compose --project-name timedesk-hris down --volumes --remove-orphans
